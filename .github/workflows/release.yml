name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check module.json version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version module.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME implies version $tag, but module.json says $manifest" >&2
            exit 1
          fi

      - name: Build module.zip
        run: |
          zip -r module.zip \
            module.json \
            README.md \
            lang \
            scripts \
            styles \
            templates

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
